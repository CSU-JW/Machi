<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦想小镇 · 联机大厅</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #223047;
      --muted: #718096;
      --brand: #2f855a;
      --brand-dark: #276749;
      --soft: #edf7f1;
      --line: #dce5df;
      --danger: #c53030;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; min-height: 100vh; color: var(--ink);
      background: linear-gradient(145deg, #edf7f1 0%, #eef3f9 50%, #f8f4eb 100%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .screen { display: none; }
    .screen.active { display: block; }
    .panel {
      background: rgba(255,255,255,.94); border: 1px solid rgba(255,255,255,.8);
      border-radius: 18px; box-shadow: 0 18px 55px rgba(34,48,71,.12);
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { margin: 0; font-size: 30px; color: var(--brand-dark); }
    .brand p { color: var(--muted); margin: 8px 0 0; }
    #auth { max-width: 460px; margin: 55px auto; padding: 0 16px; }
    .auth-card { padding: 28px; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 22px; }
    .tab { border: 0; border-radius: 9px; padding: 10px 8px; background: #edf2f7; color: #526175; }
    .tab.active { color: white; background: var(--brand); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .field { margin: 13px 0; }
    .field label { display: block; color: #526175; font-size: 13px; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 12px; border: 1px solid #cbd5e0;
      border-radius: 9px; outline: none; background: white;
    }
    .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #c6f6d5; }
    .primary, .secondary, .danger-btn {
      border: 0; border-radius: 9px; padding: 10px 15px; font-weight: 650;
    }
    .primary { color: white; background: var(--brand); }
    .primary:hover { background: var(--brand-dark); }
    .secondary { color: #3f4d61; background: #edf2f7; }
    .danger-btn { color: var(--danger); background: #fff5f5; }
    .wide { width: 100%; margin-top: 8px; }
    .message { min-height: 22px; color: var(--danger); margin: 14px 0 0; text-align: center; font-size: 14px; }
    .helper { color: var(--muted); font-size: 13px; line-height: 1.6; }

    #lobby, #waiting, #game { max-width: 1120px; margin: 0 auto; padding: 24px 16px 42px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 22px; }
    .topbar h2 { margin: 0; }
    .account-info { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .lobby-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 14px; }
    .lobby-heading h3 { margin: 0; }
    .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 15px; }
    .room-card { padding: 18px; }
    .room-title { display: flex; justify-content: space-between; align-items: center; }
    .room-title h3 { margin: 0; font-size: 21px; }
    .status { padding: 4px 8px; border-radius: 999px; font-size: 12px; background: var(--soft); color: var(--brand-dark); }
    .status.playing { color: #975a16; background: #fefcbf; }
    .room-count { margin: 14px 0 8px; color: #526175; }
    .room-players { color: var(--muted); font-size: 13px; min-height: 40px; line-height: 1.5; }
    .room-card button { width: 100%; margin-top: 13px; }
    .room-card button:disabled { cursor: not-allowed; opacity: .5; }

    .waiting-card { max-width: 650px; margin: 45px auto; padding: 30px; text-align: center; }
    .waiting-card h2 { margin-top: 0; }
    .waiting-dots { color: var(--brand); font-size: 40px; letter-spacing: 4px; }
    .seat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 24px 0; text-align: left; }
    .seat { background: #f7fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .seat.offline { opacity: .55; }
    .seat.empty { color: #a0aec0; border-style: dashed; }

    #game { display: none; }
    #game.active { display: block; }
    .turn-banner {
      font-size: 22px; font-weight: bold; text-align: center;
      padding: 12px; margin-bottom: 16px; border-radius: 10px;
      background: #fff; border: 2px solid #4caf50;
    }
    .turn-banner.me { background: #e8f5e9; }
    .dice-area { text-align: center; margin: 12px 0; min-height: 50px; }
    #dice { font-size: 32px; font-weight: bold; display: inline-block; }
    #dice.rolling { animation: shake .1s infinite; }
    @keyframes shake {
      0% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); }
      50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,-3px); }
      100% { transform: translate(2px,3px); }
    }
    .players { display: flex; gap: 12px; flex-wrap: wrap; }
    .player {
      flex: 1; min-width: 240px; background: white; border-radius: 10px; padding: 12px;
      border: 2px solid #ddd; transition: all .2s;
    }
    .player.active { border-color: #4caf50; box-shadow: 0 0 12px #4caf5077; transform: translateY(-2px); }
    .player.offline { opacity: .55; }
    .player h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .badge-offline { font-size: 11px; background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; }
    .money { font-size: 20px; font-weight: bold; color: #e67e22; }
    .cards { font-size: 13px; margin: 8px 0; line-height: 1.9; }
    .landmarks { font-size: 13px; line-height: 1.9; }
    .tag { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .tag-any { background: #d4edda; color: #155724; }
    .tag-self { background: #cce5ff; color: #004085; }
    .tag-other { background: #f8d7da; color: #721c24; }
    .tag-six { background: #fff3cd; color: #856404; }
    .tag-landmark { background: #e2d9f3; color: #4a2c7a; }
    .actions { margin: 16px 0; padding: 12px; background: white; border-radius: 10px; min-height: 58px; }
    .actions button { padding: 7px 12px; margin: 4px; font-size: 14px; cursor: pointer; }
    .actions button:disabled { opacity: .4; cursor: not-allowed; }
    .log { background: #fff; border-radius: 10px; padding: 12px; height: 240px; overflow-y: auto; font-size: 13px; font-family: monospace; line-height: 1.8; }
    .log .turn-sep { color: #888; border-top: 1px dashed #ccc; margin: 6px 0; padding-top: 4px; font-weight: bold; }
    #roomInfo { font-size: 14px; color: #888; font-weight: normal; }
    #connectionStatus { position: fixed; right: 14px; bottom: 14px; padding: 7px 10px; border-radius: 8px; background: #fff3cd; color: #856404; display: none; box-shadow: 0 4px 15px #0002; }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .seat-list { grid-template-columns: 1fr; }
      .account-info { width: 100%; justify-content: space-between; }
    }
  </style>
  <link rel="stylesheet" href="style.css?v=20261004-chat">
</head>
<body>
  <section id="auth" class="screen active">
    <div class="brand"><h1>🏘️ 梦想小镇</h1><p>登录后从大厅选择房间</p></div>
    <div class="panel auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">账号登录</button>
        <button class="tab" data-tab="register">注册账号</button>
        <button class="tab" data-tab="guest">游客进入</button>
      </div>
      <form id="loginForm" class="auth-form active">
        <div class="field"><label for="loginUsername">账号</label><input id="loginUsername" autocomplete="username" maxlength="20" required></div>
        <div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" maxlength="72" required></div>
        <button class="primary wide" type="submit">登录并进入大厅</button>
      </form>
      <form id="registerForm" class="auth-form">
        <div class="field"><label for="registerUsername">账号（字母、数字或下划线）</label><input id="registerUsername" autocomplete="username" maxlength="20" required></div>
        <div class="field"><label for="registerNickname">游戏昵称</label><input id="registerNickname" maxlength="12" required></div>
        <div class="field"><label for="registerPassword">密码（至少 6 位）</label><input id="registerPassword" type="password" autocomplete="new-password" maxlength="72" required></div>
        <button class="primary wide" type="submit">注册并登录</button>
      </form>
      <form id="guestForm" class="auth-form">
        <div class="field"><label for="guestNickname">游客昵称</label><input id="guestNickname" maxlength="12" required></div>
        <p class="helper">游客无需账号。当前浏览器会保留游客身份，用于断线重连和防止重复占座。</p>
        <button class="primary wide" type="submit">以游客身份进入</button>
      </form>
      <p id="authMessage" class="message"></p>
    </div>
  </section>

  <section id="lobby" class="screen">
    <div class="topbar">
      <div><h2>联机大厅</h2><span class="helper">选择一个等待中的房间加入</span></div>
      <div class="account-info"><span id="profileName"></span><button id="logoutButton" class="secondary">退出登录</button></div>
    </div>
    <div class="lobby-heading"><h3>房间列表</h3><label><input id="createDlc" type="checkbox"> 新房间启用海滨假日 DLC</label><button id="createRoomButton" class="primary">＋ 创建房间</button></div>
    <div id="rooms" class="rooms"></div>
  </section>

  <section id="waiting" class="screen">
    <div class="panel waiting-card">
      <div class="waiting-dots">● ● ●</div>
      <h2>房间 <span id="waitingRoomId"></span></h2>
      <p id="waitingText" class="helper"></p>
      <label class="dlc-setting"><input id="roomDlc" type="checkbox"> 启用海滨假日 DLC</label><p id="dlcSettingHint" class="helper"></p>
      <div id="waitingPlayers" class="seat-list"></div>
      <section class="chat" id="waitingChat">
        <div class="chat-head">💬 房间聊天</div>
        <div class="chat-messages" id="waitingChatMessages"></div>
        <p id="waitingChatError" class="chat-error"></p>
        <form id="waitingChatForm" class="chat-form">
          <input id="waitingChatInput" type="text" maxlength="300" placeholder="和房间里的玩家聊聊天…" autocomplete="off">
          <button class="primary" type="submit">发送</button>
        </form>
      </section>
      <button id="leaveRoomButton" class="danger-btn">退出房间，返回大厅</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="topbar">
      <h2>梦想小镇 <span id="roomInfo"></span></h2>
      <div class="account-info"><span id="gameProfile" class="helper"></span><button id="leaveGameButton" class="danger-btn">退出本局</button></div>
    </div>
    <div class="turn-banner" id="turnBanner"></div>
    <div id="dlcPanel" class="dlc-panel" hidden></div>
    <div class="dice-area"><span id="dice"></span></div>
    <div class="players" id="players"></div>
    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>
    <section class="chat" id="chat">
      <div class="chat-head">💬 房间聊天<button id="chatToggle" type="button" aria-expanded="true">收起</button><span id="chatUnread" class="chat-unread" hidden></span></div>
      <div class="chat-messages" id="chatMessages"></div>
      <p id="chatError" class="chat-error"></p>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" maxlength="300" placeholder="和房间里的玩家聊聊天…" autocomplete="off">
        <button class="primary" type="submit">发送</button>
      </form>
    </section>
  </section>

  <div id="cardModal" class="modal-layer" aria-hidden="true">
    <div class="modal-dialog card-dialog" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
      <button id="cardModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
      <div class="detail-card">
        <img id="cardModalArt" alt="">
        <span id="cardModalPoints" class="detail-points"></span>
        <span id="cardModalCost" class="detail-cost"></span>
        <div class="detail-shade"></div>
        <h3 id="cardModalTitle"></h3>
      </div>
      <p id="cardModalDescription" class="card-description"></p>
      <p id="cardModalStatus" class="card-status"></p>
      <label id="discountLabel" hidden>支付优惠 <select id="cardDiscount"></select></label>
      <div class="modal-actions">
        <button id="cardModalCancel" class="secondary" type="button">返回</button>
        <button id="cardConfirmButton" class="primary" type="button">确认购买</button>
      </div>
    </div>
  </div>

  <div id="gameOverModal" class="modal-layer" aria-hidden="true">
    <div class="modal-dialog game-over-dialog" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="trophy">🏆</div>
      <h2 id="gameOverTitle">游戏结束</h2>
      <p id="gameOverText"></p>
      <div class="modal-actions">
        <button id="gameOverClose" class="secondary" type="button">查看最终城镇</button>
        <button id="gameOverLobby" class="primary" type="button">返回大厅</button>
      </div>
    </div>
  </div>

  <dialog id="playerDialog" class="profile-dialog" aria-labelledby="playerTitle"><h3 id="playerTitle"></h3><div id="playerDetails"></div><form method="dialog"><button class="primary">关闭</button></form></dialog>
  <div id="connectionStatus">连接已断开，正在重连…</div>
  <script src="/dlc1/catalog.js?v=20261003-dlc1"></script>
  <script src="client.js?v=20261004-chat"></script>
</body>
</html>
