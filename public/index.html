<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌游联机</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
    #join { max-width: 320px; margin: 80px auto; text-align: center; }
    #join input { padding: 8px; font-size: 16px; width: 200px; }
    #join button { padding: 8px 16px; font-size: 16px; margin-top: 12px; cursor: pointer; }
    #game { display: none; }
    .players { display: flex; gap: 12px; flex-wrap: wrap; }
    .player { flex: 1; min-width: 220px; background: white; border-radius: 8px; padding: 12px;
              border: 2px solid #ddd; }
    .player.active { border-color: #4caf50; box-shadow: 0 0 8px #4caf5088; }
    .player h3 { margin: 0 0 8px; }
    .money { font-size: 20px; font-weight: bold; color: #e67e22; }
    .cards { font-size: 13px; color: #555; margin: 6px 0; line-height: 1.6; }
    .landmarks { font-size: 13px; color: #2980b9; line-height: 1.6; }
    .actions { margin: 16px 0; padding: 12px; background: white; border-radius: 8px; min-height: 40px; }
    .actions button { padding: 6px 12px; margin: 4px; font-size: 14px; cursor: pointer; }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
    .log { background: #fff; border-radius: 8px; padding: 12px; height: 200px; overflow-y: auto;
           font-size: 13px; font-family: monospace; line-height: 1.7; }
    #dice { font-size: 28px; font-weight: bold; margin: 12px 0; min-height: 36px; }
    #roomInfo { font-size: 14px; color: #888; font-weight: normal; }
  </style>
</head>
<body>

<div id="join">
  <h2>加入游戏</h2>
  <input id="nameInput" placeholder="输入你的名字" maxlength="8">
  <br>
  <button onclick="join()">进入房间</button>
  <p id="joinMsg"></p>
</div>

<div id="game">
  <h2>桌游联机 <span id="roomInfo"></span></h2>
  <div id="dice"></div>
  <div class="players" id="players"></div>
  <div class="actions" id="actions"></div>
  <div class="log" id="log"></div>
</div>

<script src="client.js"></script>
</body>
</html>
