<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦想小镇 · 联机大厅</title>
  <link rel="stylesheet" href="style.css?v=20261005-board17">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 17l2-9 5 4 4-7 4 7 5-4 2 9z"/><path d="M5 21h14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/><path d="M12 4v4M8.5 8V6.5a3.5 3.5 0 1 1 7 0V8"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h2M14 7h2M8 11h2M14 11h2"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 8.5a3 3 0 0 1 0 6M17.5 20c0-2 .8-3.4 2-4.2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h12l-2 4 2 4H5"/></symbol>
  </svg>

  <section id="auth" class="screen active">
    <div class="brand"><h1>梦想小镇</h1><p>登录后从大厅选择房间</p></div>
    <div class="panel auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">账号登录</button>
        <button class="tab" data-tab="register">注册账号</button>
        <button class="tab" data-tab="guest">游客进入</button>
      </div>
      <form id="loginForm" class="auth-form active">
        <div class="field"><label for="loginUsername">账号</label><input id="loginUsername" autocomplete="username" maxlength="20" required></div>
        <div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" maxlength="72" required></div>
        <button class="primary wide" type="submit">登录并进入大厅</button>
      </form>
      <form id="registerForm" class="auth-form">
        <div class="field"><label for="registerUsername">账号（字母、数字或下划线）</label><input id="registerUsername" autocomplete="username" maxlength="20" required></div>
        <div class="field"><label for="registerNickname">游戏昵称</label><input id="registerNickname" maxlength="12" required></div>
        <div class="field"><label for="registerPassword">密码（至少 6 位）</label><input id="registerPassword" type="password" autocomplete="new-password" maxlength="72" required></div>
        <button class="primary wide" type="submit">注册并登录</button>
      </form>
      <form id="guestForm" class="auth-form">
        <div class="field"><label for="guestNickname">游客昵称</label><input id="guestNickname" maxlength="12" required></div>
        <p class="helper">游客无需账号。当前浏览器会保留游客身份，用于断线重连和防止重复占座。</p>
        <button class="primary wide" type="submit">以游客身份进入</button>
      </form>
      <p id="authMessage" class="message"></p>
    </div>
  </section>

  <section id="lobby" class="screen">
    <div class="topbar">
      <div><h2>联机大厅</h2><span class="helper">选择一个等待中的房间加入</span></div>
      <div class="account-info"><span id="profileName"></span><button id="logoutButton" class="secondary"><svg class="icon"><use href="#i-logout"/></svg>退出登录</button></div>
    </div>
    <div class="lobby-heading">
      <h3>房间列表</h3>
      <div class="lobby-actions">
        <label class="switch"><input id="createDlc" type="checkbox"><span>启用海滨假日 DLC</span></label>
        <button id="createRoomButton" class="primary"><svg class="icon"><use href="#i-plus"/></svg>创建房间</button>
      </div>
    </div>
    <div id="rooms" class="rooms"></div>
  </section>

  <section id="waiting" class="screen">
    <div class="panel waiting-card">
      <div class="waiting-head">
        <div>
          <p class="eyebrow">房间</p>
          <h2 id="waitingRoomId">1</h2>
        </div>
        <span class="waiting-dots" aria-hidden="true">•••</span>
      </div>
      <p id="waitingText" class="helper"></p>
      <label class="switch room-dlc"><input id="roomDlc" type="checkbox"><span>启用海滨假日 DLC</span></label>
      <p id="dlcSettingHint" class="helper"></p>
      <div id="waitingPlayers" class="seat-list"></div>
      <div class="spectator-area" id="spectatorArea" hidden>
        <div class="spectator-head"><svg class="icon"><use href="#i-eye"/></svg>观战席</div>
        <div id="waitingSpectators" class="spectator-list"></div>
      </div>
      <div id="botControls" class="bot-controls" hidden>
        <label class="bot-difficulty"><svg class="icon"><use href="#i-bot"/></svg>人机难度
          <select id="botDifficulty">
            <option value="easy">简单 · 有钱就购买</option>
            <option value="normal">普通 · 计算期望收益</option>
            <option value="hard">困难 · 针对玩家策略</option>
          </select>
        </label>
        <div class="bot-buttons">
          <button id="addBotButton" class="secondary" type="button"><svg class="icon"><use href="#i-plus"/></svg>添加人机</button>
          <button id="startGameButton" class="primary" type="button"><svg class="icon"><use href="#i-play"/></svg>开始游戏</button>
        </div>
        <p id="botHint" class="helper"></p>
      </div>
      <section class="chat" id="waitingChat">
        <div class="chat-head"><svg class="icon"><use href="#i-chat"/></svg>房间聊天</div>
        <div class="chat-messages" id="waitingChatMessages"></div>
        <p id="waitingChatError" class="chat-error"></p>
        <form id="waitingChatForm" class="chat-form">
          <input id="waitingChatInput" type="text" maxlength="300" placeholder="和房间里的玩家聊聊天…" autocomplete="off">
          <button class="primary" type="submit">发送</button>
        </form>
      </section>
      <button id="leaveRoomButton" class="danger-btn"><svg class="icon"><use href="#i-logout"/></svg>退出房间，返回大厅</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="board" id="board">
      <div class="board-top" id="boardTop">
        <div class="board-hud">
          <span class="board-brand">梦想小镇</span>
          <span id="roomInfo"></span>
          <span id="gameProfile" class="helper"></span>
          <button id="leaveGameButton" class="danger-btn"><svg class="icon"><use href="#i-logout"/></svg>退出本局</button>
        </div>
        <div class="turn-banner" id="turnBanner"></div>
        <div id="dlcPanel" class="dlc-panel" hidden></div>
      </div>

      <div class="board-seat seat-0" id="seat0"></div>
      <div class="board-seat seat-1" id="seat1"></div>
      <div class="board-seat seat-2" id="seat2"></div>
      <div class="board-seat seat-3" id="seat3"></div>

      <div class="board-left" id="boardLeft">
        <div class="side-head"><svg class="icon"><use href="#i-flag"/></svg>对局记录<button id="logToggle" type="button" aria-expanded="true">收起</button></div>
        <div class="log" id="log"></div>
      </div>

      <div class="board-market" id="market"></div>

      <div class="board-right" id="boardRight">
        <section class="chat" id="chat">
          <div class="chat-head"><svg class="icon"><use href="#i-chat"/></svg>房间聊天<button id="chatToggle" type="button" aria-expanded="true">收起</button><span id="chatUnread" class="chat-unread" hidden></span></div>
          <div class="chat-messages" id="chatMessages"></div>
          <p id="chatError" class="chat-error"></p>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" maxlength="300" placeholder="聊天…" autocomplete="off">
            <button class="primary" type="submit">发送</button>
          </form>
        </section>
      </div>

      <div class="board-bottom" id="boardBottom">
        <div class="actions" id="actions" hidden></div>
        <div class="dice-area">
          <div class="dice-tray" id="diceTray" aria-live="polite">
            <div class="dice-pair" id="dicePair"></div>
            <div class="dice-result" id="diceResult">等待掷骰</div>
            <div class="dice-roll" id="diceRoll"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="cardModal" class="modal-layer" aria-hidden="true">
    <div class="modal-dialog card-dialog" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
      <button id="cardModalClose" class="modal-close" type="button" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
      <div class="detail-card">
        <picture>
          <source id="cardModalArtWebp" type="image/webp">
          <img id="cardModalArt" alt="">
        </picture>
        <span id="cardModalPoints" class="detail-points"></span>
        <span id="cardModalCost" class="detail-cost"></span>
        <h3 id="cardModalTitle"></h3>
      </div>
      <p id="cardModalDescription" class="card-description"></p>
      <p id="cardModalStatus" class="card-status"></p>
      <label id="discountLabel" hidden>支付优惠 <select id="cardDiscount"></select></label>
      <div class="modal-actions">
        <button id="cardModalCancel" class="secondary" type="button">返回</button>
        <button id="cardConfirmButton" class="primary" type="button">确认购买</button>
      </div>
    </div>
  </div>

  <div id="gameOverModal" class="modal-layer" aria-hidden="true">
    <div class="modal-dialog game-over-dialog" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="trophy"><svg class="icon icon-lg"><use href="#i-trophy"/></svg></div>
      <h2 id="gameOverTitle">游戏结束</h2>
      <p id="gameOverText"></p>
      <div class="modal-actions">
        <button id="gameOverClose" class="secondary" type="button">立即返回房间</button>
        <button id="gameOverLobby" class="primary" type="button">离开房间</button>
      </div>
    </div>
  </div>

  <dialog id="playerDialog" class="profile-dialog" aria-labelledby="playerTitle"><h3 id="playerTitle"></h3><div id="playerDetails"></div><form method="dialog"><button class="primary">关闭</button></form></dialog>
  <div id="cardTip" class="card-tip" hidden></div>
  <div id="connectionStatus">连接已断开，正在重连…</div>
  <script src="/dlc1/catalog.js?v=20261005-board17"></script>
  <script src="client.js?v=20261005-board17"></script>
</body>
</html>
